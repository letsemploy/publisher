# Local MariaDB for running and testing (see CLAUDE.md).
#
# Deliberately NOT on the default 3306: this machine runs other projects whose
# stacks publish 3306 and 8081, and a shared server means one project's
# `docker compose down` silently takes another's databases with it - or worse,
# that two projects quietly share one instance without anyone noticing.
#
# The port is read from DB_PORT by both the application and the tests, so CI -
# where MariaDB is a service container on the standard port - sets DB_PORT=3306
# and everything else keeps this default.
services:
  db:
    image: docker.io/mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
    ports:
      - '${DB_PORT:-3307}:3306'

  adminer:
    image: docker.io/adminer
    restart: always
    ports:
      - '8082:8080'

  # A local OIDC identity provider, so the real login flow can be tried without
  # the dev bypass: run the app with the `keycloak` profile (see CLAUDE.md).
  #
  # Port 8083, because 8080 is the app, 8081 another stack and 8082 adminer.
  # The realm, its client and three users (alice, bob, and mallory, whose email
  # is unverified) are imported from keycloak/ojobpub-realm.json on start. Every
  # credential in there is for this container only.
  keycloak:
    image: quay.io/keycloak/keycloak
    restart: always
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - '${KEYCLOAK_PORT:-8083}:8080'
