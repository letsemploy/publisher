<div class="list-group list-group-transparent">
  <a class="list-group-item list-group-item-action{{ if .IsHome }} active{{ end }}"
     href="{{ site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>{{ i18n "overview" }}</a>
  {{ $current := . }}
  {{ range site.RegularPages.ByWeight }}
  {{ $here := eq . $current }}
  <a class="list-group-item list-group-item-action{{ if $here }} active{{ end }}"
     href="{{ .RelPermalink }}"{{ if $here }} aria-current="page"{{ end }}>{{ .Title }}</a>
  {{ end }}
</div>
