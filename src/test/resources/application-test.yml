# Test configuration (profile: test).
#
# Profile-specific files outrank the non-profile application.properties, which is
# why the overrides below actually take effect here - a plain
# src/test/resources/application.yml would lose to src/main/resources/application.properties
# and its settings would be silently ignored.
#
# Tests that exercise the back-office also activate the dev profile, whose security
# bypass removes the need for an identity provider. dev brings in the local profile
# (the developer's database); this one follows both - TestProfiles resolves to
# dev, local, test - so the datasource below wins over the local one.
spring:
  datasource:
    url: jdbc:mariadb://127.0.0.1:${DB_PORT:3307}/publisher_test?createDatabaseIfNotExist=true
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: root
  flyway:
    enabled: true
    baselineOnMigrate: true
    validateOnMigrate: true
    table: migrations
  jpa:
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    properties:
      hibernate:
        # JobListQueryTest counts queries to prove the list does not do an N+1.
        generate_statistics: true
  sql:
    init:
      mode: always
  thymeleaf:
    cache: false

# Used only when TEST_DB=sqlite adds the sqlite profile (see TestProfiles).
app:
  sqlite:
    path: target/publisher_test.db
  # Every back-office test acts as the seeded admin, and was written when an admin
  # always had full reach. Admin mode (spec 2.10) is off by default in the
  # application; here sessions start in it, so those tests keep that reach.
  # AdminModeTest turns it off to test the default.
  admin:
    start-in-admin-mode: true

logging:
  level:
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: WARN
