<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><div class="row"><div class="col-lg-8"><form method="post" class="card card-body"><h3 th:text="${item.title}">Job</h3><div th:replace="~{jobs/form-fields :: fields}"></div><button class="btn btn-primary mt-3">Save job</button></form></div><div class="col-lg-4"><div class="card card-body mb-3"><dl><dt>Category</dt><dd th:text="${item.category != null ? item.category.name : '-'}">-</dd><dt>Employer</dt><dd th:text="${item.employer != null ? item.employer.name : '-'}">-</dd><dt>Tags</dt><dd th:text="${#strings.listJoin(item.tags.![name], ', ')}">-</dd></dl></div><form method="post" th:action="@{|/jobs/${item.id}/delete|}" class="card card-body"><button class="btn btn-danger">Delete job</button></form></div></div></section></body></html>
