<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><div class="d-flex justify-content-between mb-3"><h3>Jobs</h3><a class="btn btn-primary" th:href="@{/jobs/new}">New job</a></div><form class="card card-body mb-3" hx-get="/jobs/results" hx-target="#job-results" hx-trigger="change delay:200ms, keyup changed delay:300ms from:input"><div class="row g-3"><div class="col-md-3"><input class="form-control" type="search" name="query" placeholder="Search title, description, reference"></div><div class="col-md-2"><select class="form-select" name="domainId"><option value="">All domains</option><option th:each="domain : ${domains}" th:value="${domain.id}" th:text="${domain.name}"></option></select></div><div class="col-md-2"><select class="form-select" name="jobType"><option value="">Any type</option><option th:each="value : ${jobTypes}" th:value="${value}" th:text="${#strings.capitalize(#strings.toLowerCase(value.name()))}"></option></select></div><div class="col-md-2"><select class="form-select" name="experienceLevel"><option value="">Any level</option><option th:each="value : ${experienceLevels}" th:value="${value}" th:text="${#strings.capitalize(#strings.toLowerCase(value.name()))}"></option></select></div><div class="col-md-2"><select class="form-select" name="workType"><option value="">Any work type</option><option th:each="value : ${workTypes}" th:value="${value}" th:text="${#strings.capitalize(#strings.toLowerCase(value.name()))}"></option></select></div><div class="col-md-1"><select class="form-select" name="active"><option value="">All</option><option value="true">Active</option><option value="false">Inactive</option></select></div></div></form><div id="job-results" th:replace="~{jobs/results :: results(items=${items})}"></div></section></body></html>
