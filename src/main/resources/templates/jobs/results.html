<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="results(items)"><div class="card"><div class="table-responsive"><table class="table table-vcenter"><thead><tr><th>Title</th><th>Domain</th><th>Published</th><th>Status</th></tr></thead><tbody><tr th:each="item : ${items}"><td><a th:href="@{|/jobs/${item.id}|}" th:text="${item.title}">Job</a></td><td th:text="${item.domain.name}">Domain</td><td th:text="${item.publishedAt}">2026-01-01</td><td><span class="badge" th:classappend="${item.active} ? ' bg-green-lt' : ' bg-red-lt'" th:text="${item.active} ? 'active' : 'inactive'">active</span></td></tr></tbody></table></div></div></div></body></html>
