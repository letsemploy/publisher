<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="fields"><div class="row g-3"><div class="col-md-4"><label class="form-label">Domain</label><select class="form-select" name="domainId"><option th:each="domain : ${domains}" th:value="${domain.id}" th:text="${domain.name}" th:selected="${domain.id == form.domainId}"></option></select></div><div class="col-md-4"><label class="form-label">Employer</label><select class="form-select" name="employerId"><option value=""></option><option th:each="employer : ${employers}" th:value="${employer.id}" th:text="${employer.name}" th:selected="${employer.id == form.employerId}"></option></select></div><div class="col-md-4"><label class="form-label">Category (new or existing)</label><input class="form-control" name="categoryName" th:value="${form.categoryName}"></div><div class="col-md-6"><label class="form-label">Title</label><input class="form-control" name="title" th:value="${form.title}"></div><div class="col-md-3"><label class="form-label">Reference ID</label><input class="form-control" name="referenceId" th:value="${form.referenceId}"></div><div class="col-md-3"><label class="form-label">Language</label><input class="form-control" maxlength="2" name="language" th:value="${form.language}"></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" th:text="${form.description}"></textarea></div><div class="col-md-3"><label class="form-label">Published at</label><input class="form-control" type="date" name="publishedAt" th:value="${form.publishedAt}"></div><div class="col-md-3"><label class="form-label">Start date</label><input class="form-control" type="date" name="startDate" th:value="${form.startDate}"></div><div class="col-md-3"><label class="form-label">End date</label><input class="form-control" type="date" name="endDate" th:value="${form.endDate}"></div><div class="col-md-3"><label class="form-label">Apply before</label><input class="form-control" type="date" name="applyBefore" th:value="${form.applyBefore}"></div><div class="col-md-3"><label class="form-label">Job type</label><select class="form-select" name="jobType"><option th:each="value : ${jobTypes}" th:value="${value}" th:text="${#strings.capitalize(#strings.toLowerCase(value.name()))}" th:selected="${value == form.jobType}"></option></select></div><div class="col-md-3"><label class="form-label">Experience level</label><select class="form-select" name="experienceLevel"><option value=""></option><option th:each="value : ${experienceLevels}" th:value="${value}" th:text="${#strings.capitalize(#strings.toLowerCase(value.name()))}" th:selected="${value == form.experienceLevel}"></option></select></div><div class="col-md-3"><label class="form-label">Work type</label><select class="form-select" name="workType"><option value=""></option><option th:each="value : ${workTypes}" th:value="${value}" th:text="${#strings.capitalize(#strings.toLowerCase(value.name()))}" th:selected="${value == form.workType}"></option></select></div><div class="col-md-3"><label class="form-label">Active</label><select class="form-select" name="active"><option th:value="true" th:selected="${form.active}">true</option><option th:value="false" th:selected="${!form.active}">false</option></select></div><div class="col-md-4"><label class="form-label">Locations</label><select class="form-select" name="locationIds" multiple><option th:each="location : ${locations}" th:value="${location.id}" th:text="|${location.city}, ${location.country}|" th:selected="${form.locationIds != null and #lists.contains(form.locationIds, location.id)}"></option></select></div><div class="col-md-4"><label class="form-label">Tags (comma separated)</label><input class="form-control" name="tagNames" th:value="${form.tagNames}"></div><div class="col-md-4"><label class="form-label">URL</label><input class="form-control" name="url" th:value="${form.url}"></div><div class="col-md-2"><label class="form-label">Min workload %</label><input class="form-control" type="number" step="0.01" name="minWorkLoad" th:value="${form.minWorkLoad}"></div><div class="col-md-2"><label class="form-label">Max workload %</label><input class="form-control" type="number" step="0.01" name="maxWorkLoad" th:value="${form.maxWorkLoad}"></div><div class="col-md-2"><label class="form-label">Min salary</label><input class="form-control" type="number" step="0.01" name="minSalary" th:value="${form.minSalary}"></div><div class="col-md-2"><label class="form-label">Max salary</label><input class="form-control" type="number" step="0.01" name="maxSalary" th:value="${form.maxSalary}"></div><div class="col-md-2"><label class="form-label">Currency</label><input class="form-control" maxlength="3" name="salaryCurrency" th:value="${form.salaryCurrency}"></div><div class="col-md-2"><label class="form-label">Interval</label><select class="form-select" name="salaryInterval"><option value=""></option><option th:each="value : ${salaryIntervals}" th:value="${value}" th:text="${#strings.capitalize(#strings.toLowerCase(value.name()))}" th:selected="${value == form.salaryInterval}"></option></select></div></div></div></body></html>
