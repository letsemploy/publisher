<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><div class="row"><div class="col-lg-7"><form method="post" class="card card-body"><h3 th:text="${item.name}">Export</h3><div th:replace="~{exports/form-fields :: fields}"></div><button class="btn btn-primary mt-3">Save export</button></form></div><div class="col-lg-5"><div class="card card-body mb-3"><h4>Public endpoint</h4><p><code th:text="${publicUrl}">/public/...</code></p><p>Only one export can be active per domain.</p><h5>Reverse proxy example</h5><pre>location = <span th:text="${publicUrl}"></span> {
  proxy_pass http://publisher:8080<span th:text="${publicUrl}"></span>;
  proxy_set_header Host $host;
}</pre></div><div class="card card-body mb-3"><h4>Payload preview</h4><pre th:text="${payload}">preview</pre></div><form method="post" th:action="@{|/exports/${item.id}/delete|}" class="card card-body"><button class="btn btn-danger">Delete export</button></form></div></div></section></body></html>
