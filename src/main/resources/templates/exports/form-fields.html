<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="fields"><div class="row g-3"><div class="col-md-4"><label class="form-label">Domain</label><select class="form-select" name="domainId"><option th:each="domain : ${domains}" th:value="${domain.id}" th:text="${domain.name}" th:selected="${domain.id == form.domainId}"></option></select></div><div class="col-md-4"><label class="form-label">Employer</label><select class="form-select" name="employerId"><option value=""></option><option th:each="employer : ${employers}" th:value="${employer.id}" th:text="${employer.name}" th:selected="${employer.id == form.employerId}"></option></select></div><div class="col-md-4"><label class="form-label">Active</label><select class="form-select" name="active"><option th:value="true" th:selected="${form.active}">true</option><option th:value="false" th:selected="${!form.active}">false</option></select></div><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" th:value="${form.name}"></div><div class="col-md-6"><label class="form-label">Description</label><input class="form-control" name="description" th:value="${form.description}"></div><div class="col-12"><label class="form-label">Jobs</label><select class="form-select" name="jobIds" multiple><option th:each="job : ${jobs}" th:value="${job.id}" th:text="${job.title}" th:selected="${form.jobIds != null and #lists.contains(form.jobIds, job.id)}"></option></select><div class="form-hint">Only active jobs with past publication dates will be emitted in the JSON feed.</div></div></div></div></body></html>
