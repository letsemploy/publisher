<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><form method="post" th:action="@{/domains}" class="card card-body"><div class="mb-3"><label class="form-label">Tenant</label><select class="form-select" name="tenantId"><option th:each="tenant : ${tenants}" th:value="${tenant.id}" th:text="${tenant.name}" th:selected="${tenant.id == form.tenantId}"></option></select></div><div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" th:value="${form.name}"></div><div class="mb-3"><label class="form-label">Slug</label><input class="form-control" name="slug" th:value="${form.slug}"></div><div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" th:text="${form.description}"></textarea></div><button class="btn btn-primary">Create domain</button></form></section></body></html>
