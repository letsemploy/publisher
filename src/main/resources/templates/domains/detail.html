<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><div class="row"><div class="col-lg-8"><form method="post" class="card card-body"><h3 th:text="${item.name}">Domain</h3><div class="mb-3"><label class="form-label">Tenant</label><select class="form-select" name="tenantId"><option th:each="tenant : ${tenants}" th:value="${tenant.id}" th:text="${tenant.name}" th:selected="${tenant.id == form.tenantId}"></option></select></div><div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" th:value="${form.name}"></div><div class="mb-3"><label class="form-label">Slug</label><input class="form-control" name="slug" th:value="${form.slug}"></div><div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" th:text="${form.description}"></textarea></div><button class="btn btn-primary">Save domain</button></form></div><div class="col-lg-4"><form method="post" th:action="@{|/domains/${item.id}/delete|}" class="card card-body"><button class="btn btn-danger">Delete domain</button></form></div></div></section></body></html>
