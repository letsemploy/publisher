<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:lang="${#locale.language}"
      th:attr="data-bs-theme=${ui.theme}"
      data-bs-theme-base="gray">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title layout:title-pattern="$CONTENT_TITLE · $LAYOUT_TITLE" th:text="#{app.name}">ojobpub publisher</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}"/>
    <link rel="stylesheet" th:href="@{/vendor/tabler.min.css}"/>
    <link rel="stylesheet" th:href="@{/vendor/tabler-themes.min.css}"/>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script defer th:src="@{/vendor/htmx.min.js}"></script>
    <script defer th:src="@{/vendor/tabler.min.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
</head>
<body hx-boost="true"
      th:attr="hx-headers=${_csrf != null} ? '{&quot;' + ${_csrf.headerName} + '&quot;:&quot;' + ${_csrf.token} + '&quot;}' : null">

<a class="visually-hidden-focusable skip-link" th:href="@{#main}" th:text="#{a11y.skipToContent}">Skip to content</a>

<div class="page">
    <th:block th:replace="~{fragments/nav :: sidebar}"/>

    <div class="page-wrapper">
        <div th:replace="~{fragments/nav :: devBanner}"></div>
        <div th:replace="~{fragments/nav :: impersonationBanner}"></div>
        <div th:replace="~{fragments/nav :: topbar}"></div>

        <header class="page-header d-print-none">
            <div class="container-xl">
                <div class="row g-2 align-items-center">
                    <div class="col">
                        <nav aria-label="breadcrumb" th:if="${page.breadcrumb != null and !page.breadcrumb.isEmpty()}">
                            <ol class="breadcrumb breadcrumb-arrows">
                                <li class="breadcrumb-item" th:each="crumb : ${page.breadcrumb}"
                                    th:classappend="${crumb.href == null} ? 'active'">
                                    <a th:if="${crumb.href != null}" th:href="${crumb.href}" th:text="${crumb.label}">x</a>
                                    <span th:unless="${crumb.href != null}" th:text="${crumb.label}">x</span>
                                </li>
                            </ol>
                        </nav>
                        <h1 class="page-title" id="main" tabindex="-1" th:text="${page.title}">Title</h1>
                        <div class="text-secondary mt-1" th:if="${page.subtitle != null}" th:text="${page.subtitle}"></div>
                    </div>
                    <div class="col-auto ms-auto d-print-none">
                        <div layout:fragment="page-actions"></div>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-body">
            <div class="container-xl">
                <div th:replace="~{fragments/flash :: region}"></div>
                <div layout:fragment="content"></div>
            </div>
        </div>

        <!-- Where the source is, under which license, and which version is running
             (spec 7.3). Plain links: nothing here needs JavaScript. -->
        <footer class="footer footer-transparent d-print-none">
            <div class="container-xl">
                <div class="row text-center align-items-center flex-row-reverse">
                    <div class="col-lg-auto ms-lg-auto">
                        <ul class="list-inline list-inline-dots mb-0">
                            <li class="list-inline-item">
                                <a class="link-secondary" th:href="${ui.projectUrl}" rel="noopener">
                                    <svg th:replace="~{fragments/icon :: i('brand-github','icon')}"></svg>
                                    <span th:text="#{footer.source}">Source code</span>
                                </a>
                            </li>
                            <li class="list-inline-item">
                                <a class="link-secondary" href="https://www.apache.org/licenses/LICENSE-2.0"
                                   rel="license noopener" th:text="#{footer.license}">Apache License 2.0</a>
                            </li>
                        </ul>
                    </div>
                    <div class="col-12 col-lg-auto mt-3 mt-lg-0">
                        <ul class="list-inline list-inline-dots mb-0 text-secondary">
                            <li class="list-inline-item" th:text="#{app.name}">oJobPub Publisher</li>
                            <li class="list-inline-item" th:text="#{footer.version(${ui.version})}">Version 1.0</li>
                        </ul>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</div>

<!-- Shared container for server-rendered modals (spec 7.4) -->
<div id="modal-container"></div>

</body>
</html>
