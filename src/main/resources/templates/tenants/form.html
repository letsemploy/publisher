<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><form method="post" th:action="@{/tenants}" class="card card-body"><div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" th:value="${form.name}"></div><div class="mb-3"><label class="form-label">Slug</label><input class="form-control" name="slug" th:value="${form.slug}"></div><div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" th:text="${form.description}"></textarea></div><div class="mb-3"><label class="form-label">Users</label><select class="form-select" name="userIds" multiple><option th:each="user : ${users}" th:value="${user.id}" th:text="${user.displayName}" th:selected="${form.userIds != null and #lists.contains(form.userIds, user.id)}"></option></select></div><button class="btn btn-primary">Create tenant</button></form></section></body></html>
