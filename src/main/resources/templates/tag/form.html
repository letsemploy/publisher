<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="${form.id != null} ? #{tag.edit} : #{tag.create}">Tag</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <form th:action="${form.id != null} ? @{'/tags/' + ${form.id} + '/update'} : @{/tags/create}" method="post">
                <div th:replace="~{fragments/form :: errorSummary(${errors})}"></div>
                <div class="card">
                    <div class="card-body">
                        <div th:replace="~{fragments/form :: input('name','label.name',${form.name},'text',true,'tag.name.hint',${fieldErrors['name']},28)}"></div>
                    </div>
                    <div th:replace="~{fragments/form :: actions('label.save','/tags')}"></div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
