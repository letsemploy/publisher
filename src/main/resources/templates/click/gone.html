<!DOCTYPE html>
<!--
  A job link that leads nowhere (spec 5.6): the job is no longer published (410),
  or there is no such job (404). Seen by whoever followed a link from a job board,
  so it is standalone like login.html - no sidebar, no user - and rendered by
  JobLinkHandler without a session, in the language the browser asks for.

  No inline script or style (spec 9.4).
-->
<html xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}"
      data-bs-theme="auto"
      data-bs-theme-base="gray">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <meta name="robots" content="noindex"/>
    <title th:text="${gone} ? #{link.gone.title} : #{link.unknown.title}">Job no longer available</title>
    <link rel="stylesheet" th:href="@{/vendor/tabler.min.css}"/>
    <link rel="stylesheet" th:href="@{/vendor/tabler-themes.min.css}"/>
    <script th:src="@{/js/theme.js}"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="d-flex flex-column">
<div class="page page-center">
    <main class="container container-tight py-4" id="main">
        <div class="card card-md">
            <div class="card-body text-center">
                <h1 class="h2 mb-3" th:text="${gone} ? #{link.gone.title} : #{link.unknown.title}">
                    This job is no longer available
                </h1>
                <p class="text-secondary" th:if="${gone}"
                   th:text="${employerName != null} ? #{link.gone.lead(${employerName})} : #{link.unknown.lead}">
                    Acme AG is no longer advertising this position.
                </p>
                <p class="text-secondary" th:unless="${gone}" th:text="#{link.unknown.lead}">
                    This link does not lead to a job.
                </p>
                <a class="btn btn-primary" th:if="${employerUrl != null}" th:href="${employerUrl}"
                   rel="noopener" th:text="#{link.gone.employer(${employerName})}">Visit Acme AG</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
