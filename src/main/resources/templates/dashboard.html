<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="#{nav.dashboard}">Dashboard</title></head>
<body>
<div layout:fragment="content">

    <!-- A quiet dashboard must mean the feeds are healthy (spec 7.10) -->
    <div class="alert alert-warning" role="alert" th:if="${!dashboard.unhealthyFeeds.isEmpty()}">
        <div class="d-flex">
            <svg th:replace="~{fragments/icon :: i('alert-triangle','icon alert-icon')}"></svg>
            <div class="mx-3">
                <h4 class="alert-title" th:text="#{dashboard.excluded.title}">Jobs are being omitted</h4>
                <div class="text-secondary">
                    <ul class="mb-0">
                        <li th:each="f : ${dashboard.unhealthyFeeds}">
                            <a th:href="@{'/feeds/' + ${f.id}}" th:text="${f.name}">feed</a>
                            <span th:text="#{dashboard.excluded.count(${f.excludedCount})}">1 job omitted</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="row row-cards">
        <div class="col-sm-6 col-lg-3" th:each="stat : ${ {
                {'published', dashboard.published, 'green'},
                {'draft', dashboard.draft, 'secondary'},
                {'expired', dashboard.expired, 'yellow'},
                {'inactive', dashboard.inactive, 'dark'} } }">
            <a class="card card-link" th:href="@{/jobs(status=${stat[0]})}">
                <div class="card-body">
                    <div class="subheader" th:text="#{'status.' + ${stat[0]}}">Published</div>
                    <div class="h1 mb-0" th:text="${stat[1]}">0</div>
                </div>
                <div class="card-progress" th:classappend="'bg-' + ${stat[2]}" style="height:3px"></div>
            </a>
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-header">
            <h3 class="card-title" th:text="#{nav.feeds}">Feeds</h3>
        </div>
        <th:block th:if="${dashboard.feeds.isEmpty()}">
            <div th:replace="~{fragments/empty :: state('rss','feed.empty.title','feed.empty.subtitle','/feeds/create','feed.create')}"></div>
        </th:block>
        <div class="table-responsive" th:unless="${dashboard.feeds.isEmpty()}">
            <table class="table table-vcenter card-table">
                <thead>
                <tr>
                    <th th:text="#{label.name}">Name</th>
                    <th th:text="#{feed.publishedJobs}">Published</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${dashboard.feeds}">
                    <td><a th:href="@{'/feeds/' + ${f.id}}" th:text="${f.name}">Feed</a></td>
                    <td>
                        <span class="badge bg-green-lt" th:text="${f.publishedCount}">0</span>
                        <span class="text-secondary ms-1" th:text="#{feed.ofMembers(${f.memberCount})}">of 0</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- The URLs a website is configured with: a permalink's, not a feed's own (spec 7.10). -->
    <div class="card mt-3">
        <div class="card-header">
            <h3 class="card-title" th:text="#{permalink.title}">Permalinks</h3>
            <div class="card-actions">
                <a class="btn btn-sm" th:href="@{/feeds/permalinks/create}">
                    <svg th:replace="~{fragments/icon :: i('plus','icon')}"></svg>
                    <span th:text="#{permalink.create}">New permalink</span>
                </a>
            </div>
        </div>
        <div class="card-body text-secondary" th:if="${dashboard.permalinks.isEmpty()}"
             th:text="#{permalink.empty}">No permalinks yet.</div>
        <div class="table-responsive" th:unless="${dashboard.permalinks.isEmpty()}">
            <table class="table table-vcenter card-table">
                <thead>
                <tr>
                    <th th:text="#{label.name}">Name</th>
                    <th th:unless="${singleEmployer}" th:text="#{nav.employers}">Employer</th>
                    <th th:text="#{permalink.feed}">Publishes</th>
                    <th th:text="#{permalink.url}">URL</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${dashboard.permalinks}">
                    <td class="fw-bold" th:text="${p.name}">Careers page</td>
                    <td th:unless="${singleEmployer}" th:text="${p.employerName}">Acme</td>
                    <td>
                        <a th:if="${p.feedId != null}" th:href="@{'/feeds/' + ${p.feedId}}" th:text="${p.feedName}">Feed</a>
                        <!-- In words, not only by absence (spec 7.9). -->
                        <span class="text-secondary" th:if="${p.feedId == null}" th:text="#{permalink.feed.none}">No feed</span>
                    </td>
                    <td>
                        <div class="input-group input-group-flat">
                            <input type="text" class="form-control form-control-sm font-monospace" readonly
                                   th:value="${p.publicUrl}" th:aria-label="#{permalink.url}"/>
                            <span class="input-group-text">
                                <button type="button" class="btn btn-link link-secondary p-0 border-0"
                                        th:title="#{label.copy}" th:aria-label="#{label.copy}"
                                        th:attr="data-copied-label=#{label.copied}"
                                        data-action="copy" data-enhanced hidden>
                                    <svg th:replace="~{fragments/icon :: i('copy','icon')}"></svg>
                                </button>
                            </span>
                            <a class="btn btn-sm" th:href="${p.publicUrl}" target="_blank" rel="noopener">
                                <svg th:replace="~{fragments/icon :: i('external-link','icon')}"></svg>
                                <span th:text="#{label.open}">Open</span>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
