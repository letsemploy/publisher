<!DOCTYPE html>
<!-- Change one's own password (spec 7.24): a local account only, from the user menu. -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="#{account.password.title}">Change password</title></head>
<body>
<!-- In the Settings shell (spec 7.26), where only a local account has this page. -->
<div layout:fragment="content">
    <div th:replace="~{user/settings/shell :: shell('password', ~{account/password :: section})}"></div>
</div>

<th:block th:fragment="section">
    <form class="d-flex flex-column flex-fill" th:action="@{/account/password}" method="post" novalidate>
        <div class="card-body flex-fill">
            <p class="text-secondary" th:text="#{account.password.lead}">Changing your password signs you out everywhere else.</p>
            <div th:replace="~{fragments/form :: errorSummary(${errors})}"></div>
            <!-- Lets a password manager tell which account this is. -->
            <input type="text" name="username" autocomplete="username" th:value="${email}" hidden/>
            <div class="mb-3">
                <label class="form-label required" for="current" th:text="#{account.password.current}">Current password</label>
                <input class="form-control" id="current" name="current" type="password" required
                       autocomplete="current-password"
                       th:classappend="${fieldErrors?.get('current') != null} ? 'is-invalid'"
                       th:attr="aria-invalid=${fieldErrors?.get('current') != null} ? 'true' : null"/>
                <div class="invalid-feedback" th:if="${fieldErrors?.get('current') != null}"
                     th:text="${fieldErrors.get('current')}"></div>
            </div>
            <th:block th:replace="~{account/fragments :: newPassword}"></th:block>
        </div>
        <div th:replace="~{fragments/form :: actions('account.password.submit', @{/})}"></div>
    </form>
</th:block>
</body>
</html>
