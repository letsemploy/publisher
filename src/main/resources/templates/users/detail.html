<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><div class="row"><div class="col-lg-8"><form method="post" class="card card-body"><h3 th:text="${item.displayName}">User</h3><div class="mb-3"><label class="form-label">Display name</label><input class="form-control" name="displayName" th:value="${form.displayName}"></div><div class="mb-3"><label class="form-label">OIDC subject</label><input class="form-control" name="externalSubject" th:value="${form.externalSubject}"></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control" name="email" th:value="${form.email}"></div><div class="mb-3"><label class="form-label">Tenants</label><select class="form-select" name="tenantIds" multiple><option th:each="tenant : ${tenants}" th:value="${tenant.id}" th:text="${tenant.name}" th:selected="${form.tenantIds != null and #lists.contains(form.tenantIds, tenant.id)}"></option></select></div><button class="btn btn-primary">Save</button></form></div><div class="col-lg-4"><form method="post" th:action="@{|/users/${item.id}/delete|}" class="card card-body"><p>This user can sign in only through an external OIDC identity.</p><button class="btn btn-danger">Delete</button></form></div></div></section></body></html>
