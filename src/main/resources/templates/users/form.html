<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><form method="post" th:action="@{/users}" class="card card-body"><div class="mb-3"><label class="form-label">Display name</label><input class="form-control" name="displayName" th:value="${form.displayName}"></div><div class="mb-3"><label class="form-label">OIDC subject</label><input class="form-control" name="externalSubject" th:value="${form.externalSubject}"></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control" name="email" th:value="${form.email}"></div><div class="mb-3"><label class="form-label">Tenants</label><select class="form-select" name="tenantIds" multiple><option th:each="tenant : ${tenants}" th:value="${tenant.id}" th:text="${tenant.name}" th:selected="${form.tenantIds != null and #lists.contains(form.tenantIds, tenant.id)}"></option></select></div><button class="btn btn-primary">Create user</button></form></section></body></html>
