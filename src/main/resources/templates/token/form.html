<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="#{token.create}">Create a token</title></head>
<body>
<!-- Creating a token (spec 7.17). One form, as a page or a modal (fragments/dialog,
     spec 7.7); the secret is shown once, on the list it returns to. -->
<div layout:fragment="content">
    <div th:replace="~{fragments/dialog :: page(@{'/employers/' + ${employerId} + '/tokens'}, @{'/employers/' + ${employerId} + '/tokens'}, ~{token/form :: fields}, ~{token/form :: submit}, null)}"></div>
</div>

<th:block th:fragment="modal">
    <div th:replace="~{fragments/dialog :: modal(${page.title}, @{'/employers/' + ${employerId} + '/tokens'}, ~{token/form :: fields}, ~{token/form :: submit}, null)}"></div>
</th:block>

<th:block th:fragment="fields">
    <div th:replace="~{fragments/form :: input('name','label.name',${name},'text',true,'token.name.hint',${fieldErrors['name']},64)}"></div>

    <div class="mb-3">
        <label class="form-label" for="role" th:text="#{label.role}">Role</label>
        <select class="form-select" id="role" name="role">
            <option value="EDITOR" th:selected="${role != 'OWNER'}" th:text="#{role.editor}">Editor</option>
            <option value="OWNER" th:selected="${role == 'OWNER'}" th:text="#{role.owner}">Owner</option>
        </select>
        <small class="form-hint" th:text="#{token.role.hint}">A token acts with this role.</small>
    </div>

    <fieldset class="form-fieldset mb-0" id="scopes">
        <legend class="form-label" th:text="#{token.scopes}">Scopes</legend>
        <!-- Described by what they let a caller do, not by their identifiers (spec 7.17). -->
        <label class="form-check" th:each="s : ${scopes}">
            <input class="form-check-input" type="checkbox" name="scopes"
                   th:value="${s.name()}"
                   th:checked="${chosenScopes.contains(s.name())}"
                   th:id="'scope-' + ${s.name().toLowerCase()}"/>
            <span class="form-check-label" th:text="#{'scope.' + ${s.name().toLowerCase()} + '.label'}">Read jobs</span>
            <span class="form-check-description"
                  th:text="#{'scope.' + ${s.name().toLowerCase()} + '.hint'}">What it allows.</span>
        </label>
        <div class="invalid-feedback d-block" th:if="${fieldErrors['scopes'] != null}"
             th:text="${fieldErrors['scopes']}">Choose a scope.</div>
        <div class="alert alert-warning mt-2 mb-0" role="alert"
             th:text="#{scope.people_write.warning}">
            people:write lets a caller invite and remove colleagues.
        </div>
    </fieldset>
</th:block>

<th:block th:fragment="submit">
    <button type="submit" class="btn btn-primary">
        <svg th:replace="~{fragments/icon :: i('key','icon')}"></svg>
        <span th:text="#{token.create.submit}">Create token</span>
    </button>
</th:block>
</body>
</html>
