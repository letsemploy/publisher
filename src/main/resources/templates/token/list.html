<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="#{token.title}">API tokens</title></head>
<body>
<div layout:fragment="page-actions">
    <!-- Creating opens as a modal (spec 7.4, 7.17); without an employer there is nothing to create for. -->
    <a class="btn btn-primary" th:if="${tokens != null}"
       th:href="@{'/employers/' + ${employerId} + '/tokens/create'}"
       th:attr="hx-get=@{'/employers/' + ${employerId} + '/tokens/create'},hx-target='#modal-container'">
        <svg th:replace="~{fragments/icon :: i('plus','icon')}"></svg>
        <span th:text="#{token.create}">Create a token</span>
    </a>
</div>
<div layout:fragment="content">

    <!-- No employer at all, so there is no register to show (spec 7.17). -->
    <th:block th:if="${tokens == null}">
        <div th:replace="~{fragments/empty :: state('key','token.noEmployer.title','token.noEmployer.subtitle','/employers/create','employer.create')}"></div>
    </th:block>

    <!--
      The secret, shown exactly once (spec 2.8, 7.17). It arrives as a flash
      attribute, so a reload of this page will not show it again - which is
      what the notice below promises.
    -->
    <div class="alert alert-success mb-3" role="alert" th:if="${createdSecret}">
        <div class="d-flex">
            <svg th:replace="~{fragments/icon :: i('key','icon alert-icon')}"></svg>
            <div class="ms-2 w-100">
                <h4 class="alert-title" th:text="#{token.created.title(${createdName})}">Token created</h4>
                <p th:text="#{token.created.once}">Copy it now. It cannot be shown again.</p>
                <div class="input-group input-group-flat">
                    <input type="text" class="form-control font-monospace" readonly
                           th:value="${createdSecret}" th:aria-label="#{token.created.secret}"/>
                    <span class="input-group-text">
                        <!-- Hidden until app.js reveals it; the value is selectable without JS. -->
                        <button type="button" class="btn btn-link link-secondary p-0 border-0"
                                th:title="#{label.copy}" th:aria-label="#{label.copy}"
                                th:attr="data-copied-label=#{label.copied}"
                                data-action="copy" data-enhanced hidden>
                            <svg th:replace="~{fragments/icon :: i('copy','icon')}"></svg>
                        </button>
                    </span>
                </div>
                <p class="mt-2 mb-0 text-secondary" th:text="#{token.created.lost}">
                    If it is lost, revoke this token and create another.
                </p>
            </div>
        </div>
    </div>

    <div class="row row-cards" th:if="${tokens != null}">
        <div class="col-12">
            <div class="card">
                <div class="card-header"><h3 class="card-title" th:text="#{token.list}">Tokens</h3></div>
                <th:block th:if="${tokens.isEmpty()}">
                    <div th:replace="~{fragments/empty :: state('key','token.empty.title','token.empty.subtitle','/employers/' + ${employerId} + '/tokens/create','token.create')}"></div>
                </th:block>
                <div class="table-responsive" th:unless="${tokens.isEmpty()}">
                    <table class="table table-vcenter card-table">
                        <thead>
                        <tr>
                            <th th:text="#{label.name}">Name</th>
                            <th th:text="#{token.scopes}">Scopes</th>
                            <th th:text="#{token.lastUsed}">Last used</th>
                            <th th:text="#{token.expires}">Expires</th>
                            <th class="w-1"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${tokens}">
                            <td>
                                <div th:text="${t.name}">ats-sync</div>
                                <div class="text-secondary small font-monospace" th:text="${t.prefix}">ojp_abc</div>
                                <span class="badge bg-secondary-lt mt-1" th:if="${t.revoked}"
                                      th:text="#{token.revokedBadge}">revoked</span>
                            </td>
                            <td>
                                <span class="badge bg-blue-lt me-1" th:each="s : ${t.scopes}"
                                      th:text="#{'scope.' + ${s}}">jobs:read</span>
                            </td>
                            <td class="text-secondary">
                                <!-- The column that earns its place: a token unused for
                                     months is the one to revoke (spec 7.17). -->
                                <div th:text="${t.lastUsedAt ?: #messages.msg('token.neverUsed')}">never</div>
                                <div class="small" th:if="${t.createdBy != null}" th:text="#{token.createdBy(${t.createdBy},${t.createdAt})}">by dev</div>
                                <div class="small" th:if="${t.createdBy == null}" th:text="#{token.createdBy.deleted(${t.createdAt})}">by a deleted account</div>
                            </td>
                            <td class="text-secondary">
                                <!-- Expiry is derived from the date, never stored as
                                     a status, so a renewed token is live again at
                                     once (spec 2.8). -->
                                <div th:text="${t.expiresAt ?: #messages.msg('token.neverExpires')}">2027-09-23</div>
                                <span class="badge mt-1"
                                      th:classappend="${t.state == 'expired'} ? 'bg-red-lt'
                                                    : (${t.state == 'expiring'} ? 'bg-yellow-lt' : 'bg-green-lt')"
                                      th:unless="${t.revoked}"
                                      th:text="#{'token.state.' + ${t.state}}">active</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-ghost-danger" th:unless="${t.revoked}"
                                        th:attr="hx-get=@{'/employers/' + ${employerId} + '/tokens/' + ${t.id} + '/revoke'},
                                                 hx-target='#modal-container'"
                                        th:text="#{token.revoke}">Revoke</button>
                                <form th:if="${t.renewable}" class="d-inline"
                                      th:action="@{'/employers/' + ${employerId} + '/tokens/' + ${t.id} + '/renew'}"
                                      method="post">
                                    <button type="submit" class="btn btn-sm"
                                            th:text="${t.expired} ? #{token.reactivate} : #{token.renew}">Renew</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
