<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="${feed.name}">Feed</title></head>
<body>
<div layout:fragment="page-actions">
    <div class="btn-list">
        <a class="btn" th:href="@{'/feeds/' + ${feed.id} + '/update'}">
            <svg th:replace="~{fragments/icon :: i('pencil','icon')}"></svg>
            <span th:text="#{label.edit}">Edit</span>
        </a>
        <!-- Any member may delete a feed (spec 2.1); the modal says what stops
             working, and names the permalinks left publishing nothing (spec 7.12). -->
        <button class="btn btn-ghost-danger"
                th:attr="hx-get=@{'/feeds/' + ${feed.id} + '/delete'},hx-target='#modal-container'"
                th:text="#{label.delete}">Delete</button>
    </div>
</div>

<div layout:fragment="content">

    <!-- The URL a website is configured with is a permalink's, not the feed's own:
         it stays while the feed behind it is switched (spec 5.5, 7.12). Naming them here
         also means editing or deleting the feed holds no surprise. -->
    <div class="card mb-3">
        <div class="card-header">
            <h3 class="card-title" th:text="#{permalink.pointingHere}">Permalinks publishing this feed</h3>
        </div>
        <div class="card-body" th:if="${permalinks.isEmpty()}">
            <p class="text-secondary mb-2" th:text="#{feed.noPermalink}">No permalink publishes this feed.</p>
            <a class="btn btn-sm" th:href="@{/feeds/permalinks/create}">
                <svg th:replace="~{fragments/icon :: i('plus','icon')}"></svg>
                <span th:text="#{permalink.create}">New permalink</span>
            </a>
        </div>
        <div class="card-body" th:unless="${permalinks.isEmpty()}">
            <div th:each="p, it : ${permalinks}" th:classappend="${!it.last} ? 'mb-3'">
                <label class="form-label" th:for="'permalink-' + ${p.id}" th:text="${p.name}">Careers page</label>
                <div class="input-group input-group-flat">
                    <input type="text" class="form-control font-monospace" readonly th:id="'permalink-' + ${p.id}"
                           th:value="${p.publicUrl}"/>
                    <span class="input-group-text">
                        <!-- Hidden until app.js reveals it; the URL itself is selectable without JS. -->
                        <button type="button" class="btn btn-link link-secondary p-0 border-0"
                                th:title="#{label.copy}" th:aria-label="#{label.copy}"
                                th:attr="data-copied-label=#{label.copied}"
                                data-action="copy" data-enhanced hidden>
                            <svg th:replace="~{fragments/icon :: i('copy','icon')}"></svg>
                        </button>
                    </span>
                    <a class="btn" th:href="${p.publicUrl}" target="_blank" rel="noopener">
                        <svg th:replace="~{fragments/icon :: i('external-link','icon')}"></svg>
                        <span th:text="#{label.open}">Open</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Jobs omitted at serving time must be visible to a human, not only logged (spec 5.3) -->
    <div class="alert alert-warning" role="alert" th:if="${!feed.exclusions.isEmpty()}">
        <h4 class="alert-title" th:text="#{feed.exclusions.title}">Omitted from the published document</h4>
        <ul class="mb-0">
            <li th:each="x : ${feed.exclusions}">
                <a th:href="@{'/jobs/' + ${x.jobId}}" th:text="${x.jobTitle}">job</a>
                — <span th:text="#{${x.reasonKey}}">reason</span>
            </li>
        </ul>
    </div>

    <div class="row row-cards" id="feed-panels">
        <div th:replace="~{feed/fragments/panels :: panels}"></div>
    </div>

    <div class="card mt-3">
        <div class="card-header">
            <h3 class="card-title" th:text="#{feed.preview.title}">Published document</h3>
            <div class="card-actions">
                <span class="badge" th:classappend="${feed.schemaValid} ? 'bg-green-lt' : 'bg-red-lt'">
                    <span th:text="${feed.schemaValid} ? #{feed.schema.valid} : #{feed.schema.invalid}">valid</span>
                </span>
            </div>
        </div>
        <div class="card-body">
            <pre class="json-preview bg-surface-secondary p-3 rounded" th:text="${feed.jsonPreview}">{}</pre>
        </div>
        <!-- The feed's own URL (spec 5.1) is for testing; collapsed, and without JavaScript. -->
        <div class="card-footer">
            <details>
                <summary class="text-secondary" th:text="#{feed.testUrl}">Feed URL, for testing</summary>
                <div class="mt-2">
                    <div class="input-group input-group-flat">
                        <input type="text" class="form-control font-monospace" readonly th:value="${feed.publicUrl}"
                               th:aria-label="#{feed.testUrl}"/>
                        <span class="input-group-text">
                            <button type="button" class="btn btn-link link-secondary p-0 border-0"
                                    th:title="#{label.copy}" th:aria-label="#{label.copy}"
                                    th:attr="data-copied-label=#{label.copied}"
                                    data-action="copy" data-enhanced hidden>
                                <svg th:replace="~{fragments/icon :: i('copy','icon')}"></svg>
                            </button>
                        </span>
                        <a class="btn" th:href="${feed.publicUrl}" target="_blank" rel="noopener">
                            <svg th:replace="~{fragments/icon :: i('external-link','icon')}"></svg>
                            <span th:text="#{label.open}">Open</span>
                        </a>
                    </div>
                    <small class="form-hint" th:text="#{feed.testUrl.hint}">For a website, use a permalink.</small>
                </div>
            </details>
        </div>
    </div>
</div>
</body>
</html>
