<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="#{nav.feeds}">Feeds</title></head>
<body>
<div layout:fragment="page-actions">
    <!-- Nothing to create into without an employer (spec 2.5): the content says how to get one. -->
    <a class="btn btn-primary" th:href="@{/feeds/create}" th:attr="hx-get=@{/feeds/create},hx-target='#modal-container'" th:if="${ui.activeEmployer != null}">
        <svg th:replace="~{fragments/icon :: i('plus','icon')}"></svg>
        <span th:text="#{feed.create}">New feed</span>
    </a>
</div>
<div layout:fragment="content">

    <!-- No employer at all, so nothing to list and nowhere for a new one to belong
         (spec 2.5): the screen says how to get one instead of offering a dead create. -->
    <th:block th:if="${ui.activeEmployer == null}">
        <div class="card">
            <div th:replace="~{fragments/empty :: state('rss','feed.noEmployer.title','feed.noEmployer.subtitle','/employers/create','employer.create')}"></div>
        </div>
    </th:block>

    <th:block th:if="${ui.activeEmployer != null}">
        <div class="card">
            <th:block th:if="${feeds.isEmpty()}">
                <div th:replace="~{fragments/empty :: state('rss','feed.empty.title','feed.empty.subtitle','/feeds/create','feed.create')}"></div>
            </th:block>

            <div class="table-responsive" th:unless="${feeds.isEmpty()}">
                <table class="table table-vcenter card-table">
                    <thead>
                    <tr>
                        <th th:text="#{label.name}">Name</th>
                        <th th:text="#{feed.publishedJobs}">Published</th>
                        <th th:text="#{label.lastModifiedAt}">Changed</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="f : ${feeds}">
                        <td>
                            <a th:href="@{'/feeds/' + ${f.id}}" class="text-reset fw-bold" th:text="${f.name}">Feed</a>
                            <div class="text-secondary small" th:text="${f.slug}">slug</div>
                        </td>
                        <td>
                            <span class="badge bg-green-lt" th:text="${f.publishedCount}">0</span>
                            <span class="text-secondary ms-1" th:text="#{feed.ofMembers(${f.memberCount})}">of 0</span>
                            <span class="badge bg-yellow-lt ms-1" th:if="${f.excludedCount > 0}"
                                  th:text="#{feed.excluded(${f.excludedCount})}">omitted</span>
                        </td>
                        <td class="text-secondary" th:text="${f.lastChanged}">date</td>
                        <td>
                            <a class="btn btn-sm" th:href="@{'/feeds/' + ${f.id}}">
                                <svg th:replace="~{fragments/icon :: i('eye','icon')}"></svg>
                                <span th:text="#{label.details}">Details</span>
                            </a>
                            <!-- The feed's own URL is for testing; websites use a permalink (spec 7.12). -->
                            <a class="btn btn-sm btn-ghost-secondary" th:href="${f.publicUrl}" target="_blank" rel="noopener"
                               th:title="#{feed.test.title}">
                                <svg th:replace="~{fragments/icon :: i('external-link','icon')}"></svg>
                                <span th:text="#{feed.test}">Test</span>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Websites use a domain's permalink, managed under Domains (spec 7.12, 7.23). -->
        <div class="card mt-3" id="domains">
            <div class="card-body d-flex align-items-center gap-3">
                <p class="text-secondary mb-0 flex-fill" th:text="#{feed.domains.intro}">Websites use a domain’s permalink.</p>
                <a class="btn" th:href="@{/domains}">
                    <svg th:replace="~{fragments/icon :: i('world','icon')}"></svg>
                    <span th:text="#{nav.domains}">Domains</span>
                </a>
            </div>
        </div>
    </th:block>
</div>
</body>
</html>
