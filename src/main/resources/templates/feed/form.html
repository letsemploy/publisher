<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="${form.id != null} ? #{feed.edit} : #{feed.create}">Feed</title></head>
<body>
<!-- One form, as a page or a modal (fragments/dialog, spec 7.7). -->
<div layout:fragment="content">
    <div th:replace="~{fragments/dialog :: page(${form.id != null} ? @{'/feeds/' + ${form.id} + '/update'} : @{/feeds/create}, @{/feeds}, ~{feed/form :: fields}, ~{fragments/dialog :: save}, null)}"></div>
</div>

<th:block th:fragment="modal">
    <div th:replace="~{fragments/dialog :: modal(${page.title}, ${form.id != null} ? @{'/feeds/' + ${form.id} + '/update'} : @{/feeds/create}, ~{feed/form :: fields}, ~{fragments/dialog :: save}, null)}"></div>
</th:block>

<th:block th:fragment="fields">
    <div th:replace="~{fragments/form :: input('name','label.name',${form.name},'text',true,null,${fieldErrors['name']},255)}"></div>
    <div th:replace="~{fragments/form :: input('slug','label.slug',${form.slug},'text',true,'feed.slug.hint',${fieldErrors['slug']},64)}"></div>
    <div class="mb-3">
        <label class="form-label" th:text="#{feed.url.preview}">Resulting URL</label>
        <div class="form-control-plaintext font-monospace text-secondary text-break"
             th:text="${form.urlPreview}">https://…</div>
    </div>
    <div th:replace="~{fragments/form :: input('description','label.description',${form.description},'text',false,null,${fieldErrors['description']},255)}"></div>
</th:block>
</body>
</html>
