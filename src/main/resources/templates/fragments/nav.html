<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Dev-mode banner: authentication bypassed (spec 2.3, 7.3) -->
<!--
  Viewing as another user (spec 2.9): strongly coloured, never dismissable, and on
  every page for as long as it lasts, with the one way out. The view is read-only.
-->
<div th:fragment="impersonationBanner" th:if="${ui.viewingAs}"
     class="alert alert-important alert-danger m-0 rounded-0 d-print-none" role="status">
    <div class="container-xl d-flex align-items-center flex-wrap gap-2">
        <svg th:replace="~{fragments/icon :: i('eye','icon alert-icon')}"></svg>
        <span>
            <strong th:text="#{impersonation.banner(${ui.viewingAsName})}">Viewing as Mara Member</strong>
            <span th:if="${ui.viewingAsEmail != null}" th:text="'(' + ${ui.viewingAsEmail} + ')'">(a@b.c)</span>
            <span th:text="#{impersonation.readOnlyNote}">Read-only: nothing can be changed.</span>
        </span>
        <form class="ms-auto" th:action="@{/impersonation/stop}" method="post">
            <button type="submit" class="btn btn-sm btn-light" th:text="#{impersonation.stop}">Stop viewing</button>
        </form>
    </div>
</div>

<div th:fragment="devBanner" th:if="${ui.devMode}" class="alert alert-important alert-warning m-0 rounded-0 d-print-none" role="alert">
    <div class="container-xl d-flex align-items-center">
        <svg th:replace="~{fragments/icon :: i('alert-triangle','icon alert-icon')}"></svg>
        <strong class="mx-2" th:text="#{dev.banner.title}">Development mode</strong>
        <span th:text="#{dev.banner.detail}">Authentication is disabled.</span>
    </div>
</div>

<!--
  Sidebar (spec 7.3): the brand, the employer being worked on, and what belongs
  to it. Everything that exists without an employer is in the top bar.
-->
<aside th:fragment="sidebar" class="navbar navbar-vertical navbar-expand-lg d-print-none">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#sidebar-menu" aria-controls="sidebar-menu"
                aria-expanded="false" th:aria-label="#{a11y.toggleNav}">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="navbar-brand navbar-brand-autodark">
            <a th:href="@{/}" class="d-flex align-items-center text-reset text-decoration-none">
                <svg th:replace="~{fragments/logo :: mark('brand-mark me-2')}"></svg>
                <span th:text="#{app.name}">oJobPub Publisher</span>
            </a>
        </div>

        <div class="collapse navbar-collapse" id="sidebar-menu">
            <!-- The employer switcher heads the list, even with one employer (spec 2.5).
                 Choosing submits at once; without JavaScript the button does. -->
            <form class="sidebar-employer" th:if="${ui.activeEmployer != null}"
                  th:action="@{/context/employer}" method="post">
                <label class="form-label" for="employer-select" th:text="#{employer.select}">Employer</label>
                <select class="form-select" id="employer-select" name="employerId" data-auto-submit>
                    <option th:each="e : ${ui.employers}" th:value="${e.id}" th:text="${e.label}"
                            th:selected="${ui.activeEmployer.id == e.id}">Acme</option>
                </select>
                <button type="submit" class="btn btn-sm w-100 mt-2" data-without-js
                        th:text="#{employer.switch}">Switch employer</button>
            </form>
            <div class="sidebar-employer" th:if="${ui.activeEmployer == null}">
                <a class="btn btn-primary w-100" th:href="@{/employers/create}">
                    <svg th:replace="~{fragments/icon :: i('plus','icon')}"></svg>
                    <span th:text="#{employer.create}">New employer</span>
                </a>
            </div>
            <ul class="navbar-nav pt-lg-3">
                <li class="nav-item" th:each="item : ${ui.navItems}"
                    th:classappend="${item.active} ? 'active'">
                    <a class="nav-link" th:href="@{${item.href}}"
                       th:attr="aria-current=${item.active} ? 'page' : null">
                        <span class="nav-link-icon d-md-none d-lg-inline-block">
                            <svg th:replace="~{fragments/icon :: i(${item.icon},'icon')}"></svg>
                        </span>
                        <span class="nav-link-title" th:text="#{${item.labelKey}}">Item</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</aside>

<!--
  Top bar (spec 7.3): on the left, what exists without an employer - the
  employers, one's invitations, and for admins the users; on the right, who you
  are. It does not collapse, so on a narrow screen the links shorten to icons.
-->
<header th:fragment="topbar" class="navbar navbar-expand d-print-none">
    <div class="container-xl">
        <ul class="navbar-nav flex-row">
            <li class="nav-item" th:each="item : ${ui.topNavItems}"
                th:classappend="${item.active} ? 'active'">
                <a class="nav-link" th:href="@{${item.href}}"
                   th:attr="aria-current=${item.active} ? 'page' : null"
                   th:aria-label="#{${item.labelKey}}">
                    <svg th:replace="~{fragments/icon :: i(${item.icon},'icon')}"></svg>
                    <span class="d-none d-md-inline ms-1" th:text="#{${item.labelKey}}">Item</span>
                    <!-- Pending-invitation count; hidden at zero (spec 7.3). -->
                    <span class="badge bg-red text-white ms-1"
                          th:if="${item.href == '/invitations' and ui.pendingInvitations > 0}"
                          th:text="${ui.pendingInvitations}">0</span>
                </a>
            </li>
        </ul>
        <div class="navbar-nav flex-row ms-auto">

            <!-- Admin reach is on (spec 2.10): said in words, not only by colour (spec 7.9). -->
            <div class="nav-item me-3" th:if="${ui.admin}">
                <span class="badge bg-red-lt" th:text="#{adminMode.badge}">Admin mode</span>
            </div>

            <!-- User menu: identity, language, theme, log out -->
            <div class="nav-item dropdown">
                <a href="#" class="nav-link d-flex align-items-center text-reset dropdown-toggle"
                   data-bs-toggle="dropdown" aria-expanded="false" th:aria-label="#{label.userMenu}">
                    <span th:replace="~{fragments/avatar :: avatar(${ui.userAvatar}, 'avatar-sm')}"></span>
                    <span class="d-none d-xl-block ps-2 text-truncate" style="max-width:12rem"
                          th:text="${ui.userName}">User</span>
                </a>
                <div class="dropdown-menu dropdown-menu-end">
                    <a class="dropdown-item" th:href="@{/activity/mine}">
                        <svg th:replace="~{fragments/icon :: i('history','icon dropdown-item-icon')}"></svg>
                        <span th:text="#{activity.mine}">My activity</span>
                    </a>
                    <!-- Anyone, as themselves - never the person being viewed (spec 7.26).
                         Changing the password and deleting the account are reached from there. -->
                    <a class="dropdown-item" th:unless="${ui.viewingAs}" th:href="@{/settings}">
                        <svg th:replace="~{fragments/icon :: i('settings','icon dropdown-item-icon')}"></svg>
                        <span th:text="#{account.menu.settings}">Settings</span>
                    </a>
                    <!-- Only for an admin acting as themselves (spec 2.10); a POST, so the
                         switch is a deliberate act and the audit log can record it. -->
                    <form th:if="${ui.adminModeAvailable}" method="post"
                          th:action="${ui.admin} ? @{/admin-mode/leave} : @{/admin-mode/enter}">
                        <button type="submit" class="dropdown-item">
                            <svg th:replace="~{fragments/icon :: i('key','icon dropdown-item-icon')}"></svg>
                            <span th:text="${ui.admin} ? #{adminMode.leave} : #{adminMode.enter}">Switch to admin mode</span>
                        </button>
                    </form>
                    <div class="dropdown-divider"></div>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="dropdown-item">
                            <svg th:replace="~{fragments/icon :: i('logout','icon dropdown-item-icon')}"></svg>
                            <span th:text="#{label.logout}">Log out</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>
</body>
</html>
