<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Many-to-many picker without a JavaScript library (spec 7.8).
  Chips are backed by hidden inputs, so the selection posts with a plain form
  and the screen still works with JavaScript disabled.
-->
<div th:fragment="chips(name, items, removable)" class="mb-2"
     th:attr="data-chips=${name},data-remove-label=#{label.remove}">
    <span th:each="it : ${items}" class="badge bg-blue-lt me-1 mb-1" data-chip>
        <input type="hidden" th:name="${name}" th:value="${it.id}"/>
        <span th:text="${it.label}">item</span>
        <!-- Hidden until app.js reveals it: without JavaScript it would be a
             control that does nothing (spec 7.1). -->
        <button th:if="${removable}" type="button" class="btn-close btn-close-white ms-1"
                th:aria-label="#{label.remove}"
                data-action="remove-chip" data-enhanced hidden></button>
    </span>
    <span th:if="${items.isEmpty()}" class="text-secondary" th:text="#{picker.none}"
          data-chips-empty>None selected</span>
</div>

<div th:fragment="search(id, searchUrl, targetId, placeholderKey)" class="mb-2">
    <label class="form-label visually-hidden" th:for="${id}" th:text="#{${placeholderKey}}"></label>
    <input class="form-control" type="search" th:id="${id}" name="q"
           th:placeholder="#{${placeholderKey}}"
           th:attr="hx-get=@{${searchUrl}},hx-target='#' + ${targetId},
                    hx-trigger='input changed delay:300ms, search'"/>
    <div th:id="${targetId}" class="list-group mt-1"></div>
</div>

<!--
  Search results. Choosing one adds a chip, which app.js builds from the id and
  label carried here as data - with createElement and textContent, never from a
  string of markup: the CSP forbids evaluating code, and putting data inside
  executable text is how injection happens (spec 7.2).

  The results are not form fields. Only the chips post, so what is listed but
  not chosen is never submitted. The list itself only ever arrives through htmx,
  so these buttons never exist without the module that makes them work.
-->
<div th:fragment="results" th:remove="tag">
    <button type="button" class="list-group-item list-group-item-action" th:each="r : ${results}"
            data-action="pick" th:attr="data-target=${targetName},data-value=${r.id},data-label=${r.label}"
            th:text="${r.label}">label</button>
    <div class="list-group-item text-secondary" th:if="${results.isEmpty()}"
         th:text="#{picker.noResults}">No matches.</div>
</div>
</body>
</html>
