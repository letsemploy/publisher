<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><form method="post" th:action="@{/locations}" class="card card-body"><div class="mb-3"><label class="form-label">Domain</label><select class="form-select" name="domainId"><option th:each="domain : ${domains}" th:value="${domain.id}" th:text="${domain.name}" th:selected="${domain.id == form.domainId}"></option></select></div><div class="mb-3"><label class="form-label">City</label><input class="form-control" name="city" th:value="${form.city}"></div><div class="mb-3"><label class="form-label">Country</label><input class="form-control" name="country" maxlength="2" th:value="${form.country}"></div><button class="btn btn-primary">Create location</button></form></section></body></html>
