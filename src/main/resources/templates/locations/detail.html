<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><div class="row"><div class="col-lg-8"><form method="post" class="card card-body"><h3 th:text="${item.name}">Location</h3><div class="mb-3"><label class="form-label">Domain</label><select class="form-select" name="domainId"><option th:each="domain : ${domains}" th:value="${domain.id}" th:text="${domain.name}" th:selected="${domain.id == form.domainId}"></option></select></div><div class="mb-3"><label class="form-label">City</label><input class="form-control" name="city" th:value="${form.city}"></div><div class="mb-3"><label class="form-label">Country</label><input class="form-control" name="country" maxlength="2" th:value="${form.country}"></div><button class="btn btn-primary">Save location</button></form></div><div class="col-lg-4"><form method="post" th:action="@{|/locations/${item.id}/delete|}" class="card card-body"><button class="btn btn-danger">Delete location</button></form></div></div></section></body></html>
