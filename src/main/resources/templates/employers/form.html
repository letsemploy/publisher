<!DOCTYPE html><html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{layout}"><body><section layout:fragment="content"><form method="post" th:action="@{/employers}" class="card card-body"><div class="mb-3"><label class="form-label">Domain</label><select class="form-select" name="domainId"><option th:each="domain : ${domains}" th:value="${domain.id}" th:text="${domain.name}" th:selected="${domain.id == form.domainId}"></option></select></div><div class="mb-3"><label class="form-label">Headquarters</label><select class="form-select" name="headquartersId"><option value=""></option><option th:each="location : ${locations}" th:value="${location.id}" th:text="|${location.city}, ${location.country}|" th:selected="${location.id == form.headquartersId}"></option></select></div><div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" th:value="${form.name}"></div><div class="mb-3"><label class="form-label">Slug</label><input class="form-control" name="slug" th:value="${form.slug}"></div><div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" name="description" th:text="${form.description}"></textarea></div><div class="mb-3"><label class="form-label">Industry</label><input class="form-control" name="industry" th:value="${form.industry}"></div><div class="mb-3"><label class="form-label">Website</label><input class="form-control" name="url" th:value="${form.url}"></div><button class="btn btn-primary">Create employer</button></form></section></body></html>
