# A developer's machine (profile: local): the local MariaDB, the demo seed and
# GraphiQL. Never activated directly - it is a member of two profile groups
# (application.properties):
#
#   dev      = local + the authentication bypass (spec 2.3)
#   keycloak = local + real OIDC login against the Keycloak in docker-compose.yml
#
# So the bypass is the only thing that separates the two, and trying the real
# login flow locally does not mean duplicating the database settings.
spring:
  flyway:
    enabled: true
    baselineOnMigrate: true
    validateOnMigrate: true
    table: migrations
  # MariaDB unless the sqlite profile is active too; that one reads this path.
  datasource:
    url: jdbc:mariadb://127.0.0.1:${DB_PORT:3307}/ojobpub_publisher_dev?createDatabaseIfNotExist=true
    driver-class-name: org.mariadb.jdbc.Driver
    username: root
    password: root
  jpa:
    generate-ddl: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    hibernate.ddl-auto: none
  sql:
    init:
      mode: always
  # Introspection and GraphiQL are development conveniences only (spec 11.6).
  graphql:
    schema:
      introspection:
        enabled: true
    graphiql:
      enabled: true
app:
  sqlite:
    path: data/ojobpub_dev.db
logging:
  level:
    org:
      springframework:
        security: INFO
      hibernate:
        SQL: INFO
