spring.application.name=ojobpub-publisher
jobrunr.background-job-server.enabled=true
jobrunr.dashboard.enabled=true
jobrunr.dashboard.port=8000
spring.jpa.defer-datasource-initialization=true

# Feed URLs must be absolute and correct behind a reverse proxy (spec 9.5).
app.base-url=http://localhost:8080
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Lazy collections load in batches rather than one query per row. This is what
# lets the job list keep its SQL LIMIT: fetch-joining a collection alongside a
# Pageable would force Hibernate to paginate in memory (spec 9.3, 10).
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# The management API (spec 11). Introspection is disabled outside development.
spring.graphql.path=/graphql
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.graphiql.enabled=false
spring.graphql.schema.introspection.enabled=false

# Resource limits (spec 8.4). 0 disables a limit entirely, for a single-tenant
# installation with no abuse problem to solve. These are policy; the performance
# targets of spec 10 are capability, and still hold if a limit is raised.
app.limits.memberships-per-user=3
app.limits.jobs-per-employer=100
app.limits.feeds-per-employer=10
app.limits.pending-invitations-per-employer=20
app.limits.tokens-per-employer=10
app.limits.members-per-employer=25
