spring.application.name=ojobpub-publisher
# Flyway owns the schema, then the seed runs, then Hibernate starts; Boot orders
# them so by itself. Never set spring.jpa.defer-datasource-initialization: with
# Flyway it ties Flyway and JPA in a cycle that classpath order alone decides,
# which is how the 1.0.0 image failed to start (DatabaseInitOrderTest).

# Profile groups for local development. `local` holds the database, seed and
# GraphiQL settings; `dev` adds the authentication bypass (spec 2.3) and
# `keycloak` real OIDC login against the local Keycloak. The bypass itself is
# @Profile("dev") beans, so it cannot leak into `keycloak`.
spring.profiles.group.dev=local
spring.profiles.group.keycloak=local
spring.profiles.group.accounts=local

# Two databases: MariaDB, the default, and SQLite for a single-instance
# installation (profile `sqlite`, spec 9.3). Flyway substitutes {vendor} from
# the JDBC URL, so each gets its own migrations; the seed is chosen by platform,
# which the sqlite profile overrides.
spring.flyway.locations=classpath:db/migration/{vendor}
spring.sql.init.platform=mariadb

# Feed URLs must be absolute and correct behind a reverse proxy (spec 9.5).
app.base-url=http://localhost:8080

# Where the source lives: linked from every page's footer, with the license.
# A fork points it at its own repository.
app.project-url=https://github.com/letsemploy/publisher

# Sender of the mail local accounts need (spec 2.12). The SMTP server itself is
# spring.mail.*; without one, nothing is sent and a warning says so.
app.mail.from=ojobpub@localhost

# Local accounts, email and password (spec 2.12). Off unless configured.
app.local-accounts.enabled=false
# The password policy: length, how many of lower/upper/digits/symbols to mix
# (0-4), and the lowest zxcvbn strength score accepted (0 = unchecked ... 4).
app.local-accounts.password.min-length=12
app.local-accounts.password.max-length=128
app.local-accounts.password.required-classes=0
app.local-accounts.password.min-strength=3
# Failed sign-ins per address or client before signing in also takes a solved
# captcha (0 = always), and before every further attempt is refused (0 = never).
app.local-accounts.captcha-after-failures=3
app.local-accounts.max-attempts=10

# The captcha of the sign-up and forgot-password forms (spec 2.12): hcaptcha or
# mcaptcha, with its keys under captcha.hcaptcha.* / captcha.mcaptcha.*. Off here,
# since the starter would otherwise start an hCaptcha verifier with no keys.
captcha.enabled=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Fall back to English (messages.properties), never to the host's locale: on a German host
# a key missing in French would otherwise show German (spec 8.1).
spring.messages.fallback-to-system-locale=false

# Lazy collections load in batches rather than one query per row. This is what
# lets the job list keep its SQL LIMIT: fetch-joining a collection alongside a
# Pageable would force Hibernate to paginate in memory (spec 9.3, 10).
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# The management API (spec 11). Introspection is disabled outside development.
spring.graphql.path=/graphql
spring.graphql.schema.locations=classpath:graphql/
spring.graphql.graphiql.enabled=false
spring.graphql.schema.introspection.enabled=false

# Resource limits (spec 8.4). 0 disables a limit entirely, for a single-tenant
# installation with no abuse problem to solve. These are policy; the performance
# targets of spec 10 are capability, and still hold if a limit is raised.
app.limits.memberships-per-user=3
app.limits.jobs-per-employer=100
app.limits.feeds-per-employer=10
app.limits.pending-invitations-per-employer=20
app.limits.tokens-per-employer=10
app.limits.members-per-employer=25
app.limits.permalinks-per-employer=10

# Service tokens (spec 2.8). A token lapses after this many months and an owner
# renews it, which keeps the secret and only moves the date. 0 means never expires.
app.tokens.lifetime-months=12
app.tokens.expiry-warning-days=30

# Job links (spec 5.6). A published job's URL is {app.base-url}/go/{id}, which
# counts the click and redirects to the job's own page; false publishes the page
# itself, counting nothing. The country comes from a header a proxy or CDN sets
# (e.g. CF-IPCountry), else from a GeoIP country database (.mmdb, GeoLite2 or
# DB-IP Lite) mounted at the path given, else it is unknown. The address is used
# for the lookup only and never stored (spec 10).
app.clicks.enabled=true
app.clicks.country-header=
app.clicks.geoip-database=
# Substrings of user agents that are not people: link previews and crawlers.
app.clicks.ignore-user-agents=bot,crawler,spider,preview,facebookexternalhit,slack,whatsapp,telegram,discord,skype,curl,wget,python-requests,go-http-client,java/,okhttp,headless
app.clicks.dashboard-days=30
app.clicks.top-jobs=10

# Account pictures (spec 7.27). A provider's picture (the OIDC picture claim,
# GitHub's avatar) is downloaded by the server and served from here, so no page
# loads anything from a third party (spec 7.2); false leaves provider accounts
# with their initials unless they upload one. Uploads are limited to the size
# below, with a little room for the rest of the form.
app.pictures.fetch-provider=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
