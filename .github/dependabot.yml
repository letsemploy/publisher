# Weekly updates, one grouped PR per ecosystem for minor and patch releases.
# Majors fall outside the groups and still arrive one PR each, merged by hand;
# the grouped PRs are auto-merged once CI passes (dependabot-automerge.yml).
---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-minor-and-patch:
        update-types: ["minor", "patch"]

  # The build installs these from the lockfile (spec 9.1), so a bump needs nothing
  # pushed by hand. Only patches are grouped and auto-merged: a Tabler or htmx
  # minor can change what the screens look like, so minors arrive one PR each.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-patch:
        update-types: ["patch"]
