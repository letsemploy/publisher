# Turns on GitHub's auto-merge for Dependabot's minor and patch updates. It does
# not merge anything itself: GitHub merges once the required checks on main pass,
# so this needs "Allow auto-merge" and required status checks on the repository.
---
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Minor and patch, except npm, where only patches: a front-end minor can
      # change what the screens look like and is reviewed by hand.
      - if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
           !startsWith(steps.meta.outputs.package-ecosystem, 'npm'))
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
