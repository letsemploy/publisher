# Turns on GitHub's auto-merge for Dependabot's minor and patch updates. It does
# not merge anything itself: GitHub merges once the required checks on main pass,
# so this needs "Allow auto-merge" and required status checks on the repository.
---
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # npm is left out: Dependabot bumps the lockfile, not the vendored copies
      # the application serves, so those PRs need `make assets` first.
      - if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major'
          && steps.meta.outputs.package-ecosystem != 'npm_and_yarn'
          && steps.meta.outputs.package-ecosystem != 'npm'
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
