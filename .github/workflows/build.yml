# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.
---
name: Build Java

on:
  push:
env:
  SPRING_SQL_INIT_CONTINUE_ON_ERROR: true

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: getong/mariadb-action@v1.11
        with:
          mariadb version: '11' # Optional, default value is "latest". The version of the MariaDB
          mysql database: 'publisher_test' # Optional, default value is "test". The specified database which will be create
          mysql root password: 'root' # Required if "mysql user" is empty, default is empty. The root superuser password
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Build with Maven
        run: mvn -B clean package --file pom.xml
